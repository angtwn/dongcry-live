var BASE=new Date(2026,10,7).getTime();
function sec(s){var p=s.split(':');return (+p[0]*3600+(+p[1])*60+(+p[2]||0))*1000;}
var N=D.length,S=D.map(function(r){return BASE+sec(r[0]);}),HS=D.map(function(r){return r[0].split(':').length>2;}),AN=D.map(function(r){return r[5]==='A';});
var E=S.map(function(s,i){return i<N-1?S[i+1]:s+20*60000;});
// 排程：原定長度當預估；手動完成(m)用實際結束；延遲(h)的項目超時後持續計時；其餘依序自動接續。固定開始的項目不會比原定時間提早。
function layout(st,now){
  var rs=[],prev=0,cur=-1;
  for(var i=0;i<N;i++){
    var d=E[i]-S[i];
    var start=i===0?S[0]:(AN[i]?Math.max(prev,S[i]):prev);
    var man=st.m[i]!=null,held=false,end;
    if(man){end=Math.max(+st.m[i],start);}
    else if(st.h===i){end=Math.max(start+d,now);held=true;}
    else end=start+d;
    var done=man||(!held&&end<=now);
    rs.push({i:i,start:start,end:end,d:d,man:man,held:held,done:done});
    if(!done&&cur<0)cur=i;
    prev=end;
  }
  return {rs:rs,cur:cur};
}
